services:
  postgres:
    image: postgres:16-alpine
    container_name: mietklar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mietklar
      POSTGRES_USER: mietklar
      POSTGRES_PASSWORD: mietklar
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
